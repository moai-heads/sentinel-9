<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SENTINEL-9 // NET CLEANSE</title>
<style>
:root{
  --bg:#01070a; --panel:#061a20; --line:#0f3a45;
  --cyan:#54e0f0; --grn:#3dffa2; --mag:#b07bff; --red:#ff5c6a; --amb:#ffcf4d; --txt:#8fc0d0; --dim:#3e6b7a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);letter-spacing:.02em;overflow:hidden;
  font:12.5px/1.4 "SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace}
#crt,#vig{position:fixed;inset:0;pointer-events:none;z-index:99}
#crt{background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.28) 2px 3px);opacity:.5;mix-blend-mode:multiply}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.8) 100%)}

/* ============ FIRST-PERSON MODE (the whole game) ============ */
#fps{position:fixed;inset:0;z-index:90;display:none;background:#02070a;overflow:hidden}
#fps.on{display:block}
#glCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#02070a;z-index:1}
#fpsCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;
  cursor:crosshair;background:transparent;z-index:2;pointer-events:auto}
#fps .scan{position:absolute;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.30) 0px,rgba(0,0,0,.30) 1px,rgba(0,0,0,0) 2px,rgba(0,0,0,0) 3px);
  mix-blend-mode:multiply;opacity:.55}
#fps .vign{position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(120% 100% at 50% 50%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}
#fps .grain{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:.05;
  background-image:repeating-conic-gradient(#fff 0% 25%,#000 0% 50%);background-size:3px 3px}
#fps .exit{position:absolute;top:12px;left:14px;z-index:6;pointer-events:none;
  font:700 11px ui-monospace,monospace;letter-spacing:.14em;color:#9ff3ff;
  text-shadow:0 0 8px rgba(90,220,240,.7)}
#fps .exit b{background:rgba(9,26,32,.7);border:1px solid rgba(140,240,255,.4);border-radius:3px;
  padding:3px 7px;display:inline-block}

/* ---------- OVERLAY ---------- */
#overlay{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;background:rgba(1,6,9,.8)}
#overlay.on{display:flex;animation:flash .34s}
#overlay.soft{background:rgba(1,6,9,.45)}
@keyframes flash{0%{background:rgba(255,92,106,.5)}100%{background:rgba(1,6,9,.8)}}
.ovbox{text-align:center;border:1px solid var(--red);padding:24px 40px;border-radius:4px;background:rgba(16,2,6,.75);box-shadow:0 0 40px rgba(255,92,106,.3)}
.ovbox.good{border-color:var(--grn);background:rgba(2,16,10,.75);box-shadow:0 0 40px rgba(61,255,162,.3)}
.ovbox h1{font-size:26px;color:var(--red);letter-spacing:.2em;text-shadow:0 0 18px rgba(255,92,106,.7);font-weight:700}
.ovbox.good h1{color:var(--grn);text-shadow:0 0 18px rgba(61,255,162,.7)}
.ovbox p{color:var(--txt);margin-top:10px;font-size:12px}
.ovbox .k{color:var(--amb);font-size:13px;margin-top:8px}
.ovbox button{margin-top:16px;font:inherit;cursor:pointer;background:#1a0d12;color:var(--red);border:1px solid #6a2030;border-radius:3px;padding:9px 22px;letter-spacing:.12em;text-transform:uppercase}
.ovbox button:hover{background:#2a1018;border-color:var(--red);box-shadow:0 0 16px rgba(255,92,106,.3)}
</style>
</head>
<body>
<div id="crt"></div><div id="vig"></div>
<div id="fps">
  <canvas id="glCanvas"></canvas>
  <canvas id="fpsCanvas" width="480" height="270"></canvas>
  <div class="grain"></div>
  <div class="scan"></div>
  <div class="vign"></div>
  <div class="exit"><b>SENTINEL-9 // DEFEND THE CORE &mdash; ESC RELEASES MOUSE</b></div>
</div>
<canvas id="core3d" width="248" height="162" style="display:none"></canvas>

<div id="overlay"><div class="ovbox" id="ovBox">
  <h1 id="ovTitle">SYSTEM CRASH</h1>
  <p id="ovMsg">The core was overwhelmed.</p>
  <div class="k" id="ovK"></div>
  <button id="ovBtn">REDEPLOY</button>
</div></div>
<script>
"use strict";

/* ============================================================
   SENTINEL-9 // NET CLEANSE — first-person city defender.
   Run around the city, shoot the viruses before they reach the
   computer at the centre. The core also runs one auto-fire
   turret, which must be installed via an upgrade.
   ============================================================ */

const params=new URLSearchParams(location.search);
const SPEED=parseFloat(params.get("speed")||"1")||1;
const SEED=params.get("seed");
/* deterministic RNG (mulberry32) so headless captures are reproducible */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let RNG=(SEED!==null&&SEED!=="")?mulberry32((parseInt(SEED,10)||1)>>>0):Math.random;

/* ===================== MATH / FORMAT ===================== */
function fmt(n){
  if(!isFinite(n))return"\u221e";
  if(n<1000)return n<10?(Math.round(n*10)/10).toString():Math.floor(n).toString();
  const u=["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];
  let i=0;while(n>=1000&&i<u.length-1){n/=1000;i++;}
  if(n>=1000)return n.toExponential(2).replace("e+","e");
  return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n).toString())+u[i];
}

/* ===================== WORLD STATE ===================== */
/* S is shared with the first-person module (threats live in the 3D scene). */
const S={integrity:100,kills:0,wave:1,t:0,spawnT:1.5,threats:[],over:false,
  /* wave / intermission phase machine (see updatePhase) */
  phase:"wave",quota:14,spawned:0,chooseT:0,choices:null};
let autoplayOn=(params.get("autoplay")==="1");
/* set true to force the core screen texture to re-upload on the next tick */
let SCREEN_REFRESH=true;

/* ---------- permanent upgrades (picked on the core monitor) ---------- */
const UPG={dmg:0,rate:0,speed:0,armor:0,turret:0,spread:0,crit:0};
const UPGRADE_POOL=[
  {id:"dmg",   name:"OVERCHARGE",     desc:"+30% weapon damage",              apply(){UPG.dmg++;}},
  {id:"rate",  name:"RAPID CYCLER",   desc:"+18% fire rate",                  apply(){UPG.rate++;}},
  {id:"turret", get name(){return UPG.turret>=1?"CORE TURRET +":"CORE TURRET";},
                get desc(){return UPG.turret>=1?"+35% core turret damage":"install an auto-fire turret on the core";},
                apply(){UPG.turret++;}},
  {id:"speed", name:"SERVO LEGS",     desc:"+14% move speed",                 apply(){UPG.speed++;}},
  {id:"armor", name:"HARDENED SHELL", desc:"-12% damage taken",               apply(){UPG.armor++;}},
  {id:"spread",name:"SPLIT BARREL",   desc:"shots ricochet to 1 more threat", apply(){UPG.spread++;}},
  {id:"crit",  name:"TARGETING AI",   desc:"+12% crit chance (2.5x)",         apply(){UPG.crit++;}},
  {id:"repair",name:"NANO REPAIR",    desc:"restore 30 integrity now",        apply(){S.integrity=Math.min(100,S.integrity+30);}}
];
function upgArmorMult(){return 1-Math.min(0.6,0.12*UPG.armor);}

/* ===================== THREATS ===================== */
/* Threats live in the 3D scene: r is a WORLD radius from the core.
   They spawn on a ring around the core (full 360) and fly inward to the computer. */
const CONTACT_R=1.00;
const SPAWN_R=25.0;      /* r-progress range: threats travel SPAWN_R -> CONTACT_R */
const RING_R=24.0, RING_CONTACT_R=1.05;   /* world spawn ring radius (was 4.60) */
const THREAT_SCALE_BASE=0.165, THREAT_SCALE=0.32;  /* threat render scale (was 0.165) */
const THREAT_HIT_R=0.5*(THREAT_SCALE/THREAT_SCALE_BASE);
function threatAnchors(th){
  if(th.sx===undefined){
    const a=(th.ang!=null)?th.ang:(th.lx*Math.PI);
    th.ang=a;
    th.sx=Math.sin(a)*RING_R;
    th.sz=Math.cos(a)*RING_R;
    th.sy=2.6+Math.abs(th.ly)*3.4;
    th.cx=Math.sin(a)*RING_CONTACT_R;
    th.cz=Math.cos(a)*RING_CONTACT_R;
    th.cy=0.74+th.ly*0.20;
  }
}
function threatWorld(th){
  threatAnchors(th);
  const t=Math.min(1,Math.max(0,(SPAWN_R-th.r)/(SPAWN_R-CONTACT_R)));
  const e=t*t*(3-2*t);
  const lunge=th.phase==="attack"?Math.max(0,Math.sin(S.t*4.2+th.bobPh))*0.06:0;
  th.wx=th.sx+(th.cx-th.sx)*e;
  th.wy=th.sy+(th.cy-th.sy)*e + Math.sin(S.t*2.3+th.bobPh)*0.05 - lunge;
  th.wz=th.sz+(th.cz-th.sz)*e + lunge*0.5;
}
function syncThreatScreen(th){
  const p=Core3D.project([th.wx,th.wy,th.wz]);
  if(p&&p.vis){th.x=p.x;th.y=p.y;}else{th.x=-999;th.y=-999;}
}
function spawnThreat(){
  const w=S.wave;
  const hacker=RNG()<0.4;
  const hp=(22*Math.pow(1.34,w-1))*(hacker?1.7:1);
  const dps=(1.4*Math.pow(1.26,w-1))*(hacker?1.35:1);
  let lx=RNG()*2-1;
  lx=Math.sign(lx||1)*(0.30+0.70*Math.abs(lx));
  const th={
    id:RNG().toString(36).slice(2,8),hpKind:hacker?"hacker":"virus",
    hp,maxHp:hp,dps, lx:lx, ly:RNG()*2-1,
    r:SPAWN_R, wx:0,wy:0.9,wz:1.1, x:0,y:0,
    phase:"approach", hitT:0, dieT:0, spd:4.4+0.30*Math.min(12,w-1),
    spin:RNG()*6.2832,
    spinSpd:(RNG()<0.5?-1:1)*(hacker?0.55:1.15)*(0.8+RNG()*0.6),
    bobPh:RNG()*6.2832,
    ch:hacker?"\u2620":"\u25C9", color:hacker?"#ffcf4d":"#ff4d6a"
  };
  threatWorld(th); syncThreatScreen(th);
  S.threats.push(th);
}
function stepThreats(dt){
  for(const th of S.threats){
    if(th.phase==="dying"){th.dieT-=dt;continue;}
    th.spin+=th.spinSpd*dt;
    if(th.phase==="approach"){
      th.r-=th.spd*dt;
      if(th.r<=CONTACT_R){th.r=CONTACT_R;th.phase="attack";th.hitT=0.22;impact(th,false);}
    }else{
      th.hitT-=dt;
      if(th.hitT<=0){impact(th,true);th.hitT=0.42+0.06*RNG();}
      S.integrity-=th.dps*dt*upgArmorMult();
    }
    threatWorld(th); syncThreatScreen(th);
  }
  S.threats=S.threats.filter(t=>!(t.phase==="dying"&&t.dieT<=0));
  if(S.integrity<=0){S.integrity=0;gameOver();return;}
  /* spawner: each wave has a finite quota of threats to throw at the core */
  if(S.phase==="wave"){
    S.spawnT-=dt;
    const remaining=S.quota-S.spawned;
    const maxT=Math.min(remaining,8+Math.floor((S.wave-1)*1.4));
    if(S.spawnT<=0&&remaining>0&&S.threats.length<maxT){
      spawnThreat();
      S.spawned++;
      S.spawnT=Math.max(0.45,2.8-(S.wave-1)*0.22);
    }
  }
  /* integrity regens whenever the core is not under attack */
  const liveN=S.threats.reduce((n,t)=>n+(t.phase!=="dying"?1:0),0);
  if(liveN===0&&S.integrity<100)S.integrity=Math.min(100,S.integrity+(S.phase==="wave"?2.5:8)*dt);
}

/* ===================== WEAPONS (core auto-fire turret) ===================== */
/* The core starts UNARMED. The player must install the CORE TURRET upgrade;
   once installed it auto-fires on its own. */
const WEAPONS=[
  {id:"pulse",name:"PULSE SENDER",chain:1,minSector:0,col:[140,255,170],dmg:8,rate:1.10}
];
function weaponLv(w){return 1;}
function overMult(){return 1;}
function coolMult(){return 1+0.18*UPG.rate;}
function weaponRate(w){return w.rate;}
function turretOnline(){return UPG.turret>=1;}
function weaponDmg(w){return w.dmg*(1+0.35*Math.max(0,UPG.turret-1));}
function totalWeaponDps(){let d=0;for(const w of WEAPONS)d+=weaponDmg(w)/weaponRate(w);return d;}
function threatDps(){return totalWeaponDps();}

let TRACERS=[];             // muzzle->target beams, fed to the renderer
function damageThreat(th,dmg){
  if(th.phase==="dying")return;
  th.hp-=dmg;
  if(th.hp<=0){th.hp=0;th.phase="dying";th.dieT=0.42;burst(th);neutralized(th);}
}
function pushTracer(th,w){
  TRACERS.push({ax:0,ay:0.62,az:0.46, bx:th.wx,by:th.wy,bz:th.wz, col:w.col, core:true, life:0.34,max:0.34});
  if(TRACERS.length>64)TRACERS.splice(0,TRACERS.length-64);
}
const WCD={};
function stepWeapons(dt){
  if(!turretOnline())return;
  for(const id in WCD)WCD[id]-=dt;
  for(const w of WEAPONS){
    if(WCD[w.id]==null)WCD[w.id]=RNG()*0.4;
    if(WCD[w.id]>0)continue;
    const live=S.threats.filter(t=>t.phase!=="dying");
    if(!live.length)continue;
    WCD[w.id]=weaponRate(w);
    live.sort((a,b)=>a.r-b.r);
    const n=Math.min(w.chain,live.length), d=weaponDmg(w);
    for(let i=0;i<n;i++){const t=live[i];damageThreat(t,d);pushTracer(t,w);}
  }
}

/* ===================== WAVE / UPGRADE PHASE MACHINE =====================
   A wave is a finite quota of threats. When the quota is spent and every threat
   is destroyed, three upgrades are offered ON THE MONITOR immediately (no
   waiting on a progress bar); the player presses 1/2/3 to install one, and that
   immediately starts the next wave. */
function beginChoose(){
  S.phase="choose";S.choices=rollUpgrades(3);S.chooseT=0;
  /* the first time, guarantee the core turret is installable */
  if(UPG.turret<1){
    const turretDef=UPGRADE_POOL.find(c=>c.id==="turret");
    const ti=S.choices.findIndex(c=>c.id==="turret");
    if(ti<0)S.choices[0]=turretDef;
    else if(ti>0){S.choices.splice(ti,1);S.choices.unshift(turretDef);}
  }
  SCREEN_REFRESH=true;
}
function rollUpgrades(n){
  const pool=UPGRADE_POOL.slice(),out=[];
  while(out.length<n&&pool.length){
    out.push(pool.splice((RNG()*pool.length)|0,1)[0]);
  }
  return out;
}
function pickUpgrade(idx){
  if(S.phase!=="choose"||!S.choices)return null;
  const c=S.choices[idx];if(!c)return null;
  c.apply();
  S.wave++;
  S.quota=14+3*(S.wave-1);
  S.spawned=0;S.spawnT=2.0;
  S.phase="wave";S.choices=null;S.chooseT=0;
  SCREEN_REFRESH=true;
  return c;
}
function updatePhase(dt){
  if(S.over)return;
  if(S.phase==="wave"){
    const live=S.threats.reduce((n,t)=>n+(t.phase!=="dying"?1:0),0);
    if(S.spawned>=S.quota&&live===0)beginChoose();
  }else if(S.phase==="choose"){
    S.chooseT+=dt;
    if(autoplayOn&&S.chooseT>1.6)pickUpgrade((RNG()*S.choices.length)|0);
  }
}
function neutralized(th){
  S.kills++;
}

/* ===================== FX (kept lightweight; particles are 2D, HUD-side) ===================== */
let PFX=[], DMG=[];
let shieldTier=-1, breachT=0, shakeT=0;
function burst(th){
  for(let i=0;i<12;i++){
    const a=RNG()*6.2832, sp=26+RNG()*78;
    PFX.push({x:th.x,y:th.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*0.72,life:0.5+RNG()*0.25,max:0.75,c:th.color,s:1.6+RNG()*2.4});
  }
  if(PFX.length>420)PFX.splice(0,PFX.length-420);
}
function impact(th,atCore){
  const n=atCore?4:6;
  for(let i=0;i<n;i++){
    const a=(atCore?Math.PI*2*RNG():Math.atan2(th.y-80,th.x-140)+Math.PI)+(RNG()-0.5)*1.2;
    const sp=18+RNG()*46;
    PFX.push({x:th.x,y:th.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*0.72,life:0.28+RNG()*0.2,max:0.48,c:atCore?"#54d8ff":"#ffcf4d",s:1.2+RNG()*1.6});
  }
  if(atCore)DMG.push({x:th.x,y:th.y-8,txt:"-"+fmt(th.dps),life:0.6,max:0.6,c:"#ff4d6a"});
  if(PFX.length>420)PFX.splice(0,PFX.length-420);
  if(DMG.length>40)DMG.splice(0,DMG.length-40);
  doShake(0.1);
}
function doShake(t){shakeT=Math.max(shakeT,t);}
function updateCoreFx(dt){
  const ip=Math.max(0,Math.min(100,S.integrity));
  const tier=ip>66?0:(ip>33?1:2);
  if(tier>shieldTier && shieldTier>=0)breachT=0.55;
  shieldTier=tier;
  if(breachT>0)breachT-=dt;
  if(shakeT>0)shakeT-=dt;
}

/* ===================== OVERLAY ===================== */
const ovEl=document.getElementById("overlay"), ovBox=document.getElementById("ovBox");
let ovTimer=null;
function showOverlay(title,msg,k,good,autoHide){
  document.getElementById("ovTitle").textContent=title;
  document.getElementById("ovMsg").textContent=msg;
  document.getElementById("ovK").textContent=k||"";
  ovBox.className="ovbox"+(good?" good":"");
  ovEl.classList.toggle("soft",!!autoHide);
  ovEl.classList.add("on");
  if(ovTimer){clearTimeout(ovTimer);ovTimer=null;}
  if(autoHide)ovTimer=setTimeout(()=>ovEl.classList.remove("on"),autoHide);
}
function hideOverlay(){ovEl.classList.remove("on");}
function gameOver(){
  if(S.over)return;
  S.over=true;
  showOverlay("SYSTEM CRASH","The core was overwhelmed by the swarm.",
    "WAVE "+S.wave+"  \u00b7  "+S.kills+" THREATS NEUTRALIZED");
}
function redeploy(){
  S.integrity=100;S.kills=0;S.wave=1;S.t=0;S.spawnT=1.5;S.threats=[];S.over=false;
  S.phase="wave";S.quota=14;S.spawned=0;S.chooseT=0;S.choices=null;
  for(const k in UPG)UPG[k]=0;
  TRACERS=[];PFX=[];DMG=[];shieldTier=-1;breachT=0;shakeT=0;
  SCREEN_REFRESH=true;
  hideOverlay();
}
document.getElementById("ovBtn").addEventListener("click",redeploy);

/* ===================== PS1 LOW-POLY CORE (enemy meshes + orbit projection) ===================== */
const Core3D=(function(){
  const W=248,H=162;
  const cv=document.getElementById("core3d");
  if(!cv)return{frame(){},setScreen(){},setBright(){},setFlags(){},setThreats(){},setTracers(){},project(){return {x:-9999,y:-9999,zv:0,k:0,vis:false};}};
  cv.width=W;cv.height=H;
  const ctx=cv.getContext("2d");
  const back=document.createElement("canvas");back.width=W;back.height=H;
  const bg=back.getContext("2d");

  /* ---------- textures ---------- */
  function mk(w,h,fn){const c=document.createElement("canvas");c.width=w;c.height=h;fn(c.getContext("2d"),w,h);return c;}
  function noise(g,w,h,n,a){for(let i=0;i<n;i++){g.fillStyle="rgba(0,0,0,"+(a*Math.random()).toFixed(3)+")";g.fillRect(Math.random()*w|0,Math.random()*h|0,2,1);}}

  const texMetal=mk(64,64,(g,w,h)=>{
    g.fillStyle="#0f333d";g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=16){g.fillStyle=(y%32)?"#0d2b34":"#123a45";g.fillRect(0,y,w,16);}
    g.strokeStyle="rgba(84,224,240,.14)";
    for(let x=0;x<=w;x+=16){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,h);g.stroke();}
    g.strokeStyle="rgba(0,0,0,.35)";
    for(let y=0;y<=h;y+=16){g.beginPath();g.moveTo(0,y+.5);g.lineTo(w,y+.5);g.stroke();}
    noise(g,w,h,60,.16);
  });
  const texPanel=mk(64,64,(g,w,h)=>{
    g.fillStyle="#0c2a33";g.fillRect(0,0,w,h);
    g.fillStyle="rgba(84,224,240,.18)";g.fillRect(4,4,w-8,2);g.fillRect(4,h-6,w-8,2);
    g.fillStyle="rgba(0,0,0,.4)";
    for(let y=10;y<h-6;y+=4)g.fillRect(6,y,w-12,1);
    noise(g,w,h,50,.2);
  });
  const texGrid=mk(128,128,(g,w,h)=>{
    g.fillStyle="#05121a";g.fillRect(0,0,w,h);
    g.strokeStyle="rgba(30,110,130,.55)";g.lineWidth=1;
    for(let i=0;i<=w;i+=16){g.beginPath();g.moveTo(i+.5,0);g.lineTo(i+.5,h);g.stroke();g.beginPath();g.moveTo(0,i+.5);g.lineTo(w,i+.5);g.stroke();}
    g.strokeStyle="rgba(84,224,240,.5)";
    for(let i=0;i<=w;i+=64){g.beginPath();g.moveTo(i+.5,0);g.lineTo(i+.5,h);g.stroke();g.beginPath();g.moveTo(0,i+.5);g.lineTo(w,i+.5);g.stroke();}

  /* ---------- low-poly enemy meshes ---------- */
  function coneFaces(dir,len,base,r0,col,em,nseg){

    }

    for(let i=0;i<nseg;i++){

  function icoFaces(R,col,em){

  /* ---------- state ---------- */

  /* project a point given in the (rotating) rig frame to canvas coords */
  function project(p){
    const c2=Math.cos(yaw), s2=Math.sin(yaw);

  function texTriPlus(g,tex,pts,uv,shade,fog){
    const n=pts.length;
    const tris=n===4?[[0,1,2],[0,2,3]]:[[0,1,2]];
    for(const tr of tris){
      const S0=pts[tr[0]],S1=pts[tr[1]],S2=pts[tr[2]];
      const T0=[uv[tr[0]][0]*tex.width,uv[tr[0]][1]*tex.height];
      const T1=[uv[tr[1]][0]*tex.width,uv[tr[1]][1]*tex.height];
      const T2=[uv[tr[2]][0]*tex.width,uv[tr[2]][1]*tex.height];
      const d=(T1[0]-T0[0])*(T2[1]-T0[1])-(T2[0]-T0[0])*(T1[1]-T0[1]);
      if(Math.abs(d)<1e-6)continue;
      const a=((S1[0]-S0[0])*(T2[1]-T0[1])-(S2[0]-S0[0])*(T1[1]-T0[1]))/d;
      const cc=((T1[0]-T0[0])*(S2[0]-S0[0])-(T2[0]-T0[0])*(S1[0]-S0[0]))/d;
      const e=S0[0]-a*T0[0]-cc*T0[1];

      const dd=((T1[0]-T0[0])*(S2[1]-S0[1])-(T2[0]-T0[0])*(S1[1]-S0[1]))/d;

        g.clip();

        if(fog>0){g.fillStyle="rgba(6,16,22,"+fog.toFixed(3)+")";g.fill();}

  function dither(){

  function renderScene(time){
    const c=Math.cos(yaw),s=Math.sin(yaw), bob=Math.sin(time*1.6)*0.015;
    const all=scene.slice();
    for(const f of model){
      all.push({p:f.p.map(v=>{const x=v[0]*c+v[2]*s,z=-v[0]*s+v[2]*c;return[x,v[1]+bob,z];}),
        n:[f.n[0]*c+f.n[2]*s,f.n[1],-f.n[0]*s+f.n[2]*c],

    }

    /* ---- enemies: low-poly meshes living in the 3D world ---- */
    const liveE=[];
    for(const e of enemies){

      const dying=!!e.dying;
      const dp=dying?1-(e.dieT/0.42):0;

    }
    /* background */
    bg.setTransform(1,0,0,1,0,0);
    const grd=bg.createLinearGradient(0,0,0,H);

    bg.fillStyle=hg;bg.fillRect(0,0,W,H);

    /* project + cull */

    for(const f of all){

        const rx=v[0]-camPos[0],ry=v[1]-camPos[1],rz=v[2]-camPos[2];
        const zv=F[0]*rx+F[1]*ry+F[2]*rz;
        if(zv<0.12){ok=false;break;}
        const xv=R[0]*rx+R[1]*ry+R[2]*rz;
        const yv=U[0]*rx+U[1]*ry+U[2]*rz;

        if(f.em>0){
          const e=f.em*(flags.healing?1:0.88);
          const lit=0.8+0.2*(bright-0.5);

      bg.fillStyle="rgba(255,255,255,.16)"; bg.fillRect(x0,y0,w2,h2);
      bg.fillStyle=e.kind==="hacker"?"#ffcf4d":"#ff4d6a";
      bg.fillRect(x0,y0,Math.max(1,Math.round(w2*e.hpPct)),h2);

    // weapon tracers: bright beam from the monitor muzzle to each target
    for(const t of tracers){
      const kol=t.life/t.max;
      const a=project([t.ax,t.ay,t.az]), b=project([t.bx,t.by,t.bz]);
      const vis = a.vis || b.vis;

      const px = a.vis?a.x:b.x, py = a.vis?a.y:b.y;

      bg.lineWidth = 1;
      bg.beginPath(); bg.moveTo(px,py); bg.lineTo(b.x,b.y); bg.stroke();
      if(b.vis){ bg.fillStyle="rgba(255,255,255,"+(Math.max(0,kol)*0.9).toFixed(2)+")"; bg.fillRect(Math.round(b.x)-1,Math.round(b.y)-1,3,3); }

    dither();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,W,H);ctx.imageSmoothingEnabled=false;
    ctx.drawImage(back,0,0);

  function doFrame(dt){

  }

    "precision highp float;",
    "varying vec3 vCol;varying vec3 vNrm;varying vec2 vUV;varying float vEm;varying float vTile;varying vec3 vWPos;",
    "uniform vec3 uLight;uniform vec3 uFogCol;uniform vec3 uCam;uniform sampler2D uDither;uniform sampler2D uAtlas;uniform sampler2D uScreen;",
    "uniform float uAtlasCols;uniform float uTexGain;uniform float uFade;uniform float uDbg;uniform float uTracer;",

          [b[0]+side[0],b[1]+side[1],b[2]+side[2]],

        side2=[side2[0]*width*0.72,side2[1]*width*0.72,side2[2]*width*0.72];
        const col=t.col?[t.col[0]/255,t.col[1]/255,t.col[2]/255]:[0.55,0.95,1.0];
        addQuad(a,b,side,col);addQuad(a,b,side2,col);k++;

  function bg(){

  function ctxt(t,y,col,size,bold){

    g.fillStyle=GX;g.fillRect(x+2,y+2,w-4,h-4);

    g.fillStyle=G;g.fillRect(x+2,y+2,fw,h-4);
  }
  function header(right){
    txt("SENTINEL-9",7,4,G,10,true);
    g.font="9px ui-monospace,Menlo,Consolas,monospace";
    const bw=g.measureText("SENTINEL-9").width;
    txt("// NET CLEANSE",7+Math.max(bw,62),4,GD,9,false);
    if(right){g.font="9px ui-monospace,Menlo,Consolas,monospace";
      txt(right,W-7-g.measureText(right).width,4,GD,9,false);}
    g.strokeStyle=GX;g.beginPath();g.moveTo(0,17.5);g.lineTo(W,17.5);g.stroke();
  }

    bg();

      header("UPGRADE");

      const cs=S.choices||[];
      const y0=46,dy=34;
      for(let i=0;i<cs.length;i++){
        const y=y0+i*dy;
        txt("["+(i+1)+"]",12,y,G,11,true);
        txt(cs[i].name,44,y,G,11,true);
        txt(cs[i].desc,44,y+13,GD,9,false);
      }
      const p=S.chooseT||0;
      ctxt("PRESS 1 / 2 / 3 TO INSTALL"+(((p*2)|0)%2?"_":""),H-16,G,9,true);
    }else{
      header("WAVE "+S.wave);
      ctxt("CONTAINMENT ACTIVE",26,G,11,true);
      const live=S.threats.reduce((n,t)=>n+(t.phase!=="dying"?1:0),0);
      const rows=[
        ["THREATS ACTIVE",String(live)],
        ["SPAWNED",S.spawned+"/"+S.quota],
        ["INTEGRITY",Math.max(0,Math.round(S.integrity))+"%"],
        ["NEUTRALIZED",String(S.kills)],
        ["CORE TURRET",turretOnline()?"ONLINE":"OFFLINE"]
      ];
      for(let i=0;i<rows.length;i++){
        const y=48+i*15;
        txt(rows[i][0],14,y,GD,9,false);
        g.font="bold 9px ui-monospace,Menlo,Consolas,monospace";
        txt(rows[i][1],W-14-g.measureText(rows[i][1]).width,y,G,9,true);

    }

  function tick(){
    const key=S.phase+"|"+S.wave+"|"+S.threats.length+"|"+Math.round(S.integrity)+"|"+S.spawned+"|"+

      (S.choices?S.choices.map(c=>c.id).join(","):"")+"|"+((S.t*2)|0);

    if(location.search.indexOf("noscreen")<0)list.push(face([[-0.62,0.20,0.452],[0.62,0.20,0.452],[0.62,1.05,0.452],[-0.62,1.05,0.452]],[0,0,1],[255,255,255],{tex:"__screen__",em:0.95}));
    addBox(list,0,0.16,-0.05,0.24,0.12,0.22,[18,48,58],null);
    addBox(list,0,0.06,0.05,0.72,0.07,0.5,[22,58,70],null);
    addBox(list,0,0.66,-1.02,0.56,1.32,0.52,[20,54,66],null);
    list.push(face([[-0.2,0.95,-0.759],[0.2,0.95,-0.759],[0.2,0.99,-0.759],[-0.2,0.99,-0.759]],[0,0,-1],[60,220,255],{em:1}));
    list.push(face([[-0.2,0.80,-0.759],[0.2,0.80,-0.759],[0.2,0.84,-0.759],[-0.2,0.84,-0.759]],[0,0,-1],[60,220,255],{em:1}));
    addBox(list,0,0.05,0.82,1.12,0.06,0.4,[18,48,58],null);
    list.push(face([[-0.5,0.081,0.63],[0.5,0.081,0.63],[0.5,0.081,1.01],[-0.5,0.081,1.01]],[0,1,0],[40,150,180],{em:0.4}));
    /* floating icosahedron core */
    (function(){
      const t=(1+Math.sqrt(5))/2;
      const iv=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(nrm);
      const iF=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
      const C=[0,1.42,0],RAD=0.30;
      for(const f of iF){
        const p=[iv[f[0]],iv[f[1]],iv[f[2]]].map(v=>[C[0]+v[0]*RAD,C[1]+v[1]*RAD,C[2]+v[2]*RAD]);
        const n=nrm([(p[0][0]+p[1][0]+p[2][0])/3-C[0],(p[0][1]+p[1][1]+p[2][1])/3-C[1],(p[0][2]+p[1][2]+p[2][2])/3-C[2]]);
        list.push(face(p,n,[90,235,255],{em:0.85}));
      }
    })();
  }
  buildWorld();
  /* hand the static world + enemy meshes to the WebGL renderer */
  try{ GLWorld.setWorld(world); GLWorld.setEnemyMeshes(Core3D.mesh.virus,Core3D.mesh.hacker); }catch(e){ console.error("GLWorld init",e); }

  const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];

  /* ---------- player state / input ---------- */
  let active=false, locked=false;
  const keys={};
  let firing=false, playerCd=0, fireHeld=0;
  let bobPhase=0, walkAmt=0, recoil=0, swayX=0, swayY=0;
  let hitFlash=0, autoA=Math.PI*0.5, dmgList=[], ftracers=[];
  let alive=0, killPulse=0;

  const SENS=0.0022, PLAYER_RATE=0.15, PITCH_MAX=1.32;

  /* ---------- enemies from shared world state ---------- */
  function collectEnemies(faces){
    const meshV=Core3D.mesh.virus, meshH=Core3D.mesh.hacker;
    let n=0;
    for(const th of S.threats){
      if(th.phase==="dying"&&th.dieT<=0)continue;
      const dying=th.phase==="dying";
      const dp=dying?1-(th.dieT/0.42):0;
      const prog=Math.min(1,Math.max(0,(SPAWN_R-th.r)/(SPAWN_R-CONTACT_R)));
      const sc=THREAT_SCALE*(th.hpKind==="hacker"?0.9:1.0)*(0.80+0.20*prog)*(dying?1+0.95*dp:1);
      const spin=th.spin;
      const cs=Math.cos(spin),ss=Math.sin(spin);
      const fade=dying?Math.min(1,dp*1.05):0;
      const mesh=th.hpKind==="hacker"?meshH:meshV;
      const boost=th.phase==="attack"?1.35:1;
      for(const f of mesh){
        const p=[],nn=[];
        for(const v of f.p){
          const x=v[0]*cs+v[2]*ss, z=-v[0]*ss+v[2]*cs;
          p.push([x*sc+th.wx, v[1]*sc+th.wy, z*sc+th.wz]);
        }
        const nx=f.n[0]*cs+f.n[2]*ss, nz=-f.n[0]*ss+f.n[2]*cs;
        faces.push({p:p,n:[nx,f.n[1],nz],col:[Math.min(255,f.col[0]*boost),Math.min(255,f.col[1]*boost),Math.min(255,f.col[2]*boost)],tex:null,uv:null,em:f.em,_fogAdd:fade,_enemy:th});
      }
      n++;
    }
    return n;
  }

  /* ---------- weapons ---------- */
  function totalWeaponLevels(){let s=0;for(const w of WEAPONS)s+=weaponLv(w);return s;}
  function playerDmg(mult){return 17*(1+0.16*totalWeaponLevels())*overMult()*(1+0.30*UPG.dmg)*(mult||1);}

  function hitscan(){
    const B=basis();
    let best=null,bestT=1e9;
    for(const th of S.threats){
      if(th.phase==="dying")continue;
      const dx=th.wx-P.x,dy=th.wy-P.y,dz=th.wz-P.z;
      const tca=dx*B.dir[0]+dy*B.dir[1]+dz*B.dir[2];
      if(tca<0.2)continue;
      const d2=dx*dx+dy*dy+dz*dz-tca*tca;
      const rr=THREAT_HIT_R*(th.hpKind==="hacker"?0.95:1.05);
      if(d2>rr*rr)continue;
      const thit=tca-Math.sqrt(Math.max(0,rr*rr-d2));
      if(thit<bestT){bestT=thit;best=th;}
    }
    return{best:best,B:B,t:bestT};
  }
  /* up to n extra live threats closest to the aim ray (SPLIT BARREL upgrade) */
  function nearbyThreats(B,primary,n){
    if(n<=0)return [];
    const cand=[];
    for(const th of S.threats){
      if(th.phase==="dying"||th===primary)continue;
      const dx=th.wx-P.x,dy=th.wy-P.y,dz=th.wz-P.z;
      const tca=dx*B.dir[0]+dy*B.dir[1]+dz*B.dir[2];
      if(tca<0.3)continue;
      const d2=dx*dx+dy*dy+dz*dz-tca*tca;
      if(d2>3.2)continue;
      cand.push({th:th,d2:d2});
    }
    cand.sort((a,b)=>a.d2-b.d2);
    return cand.slice(0,n).map(o=>o.th);
  }
  function fire(){
    if(!active)return;
    if(S.phase==="choose")return;
    if(playerCd>0)return;
    playerCd=PLAYER_RATE/coolMult();
    const hs=hitscan(), B=hs.B;
    const muzzle=[
      P.x+B.dir[0]*0.42+B.right[0]*0.20-B.up[0]*0.14,
      P.y+B.dir[1]*0.42+B.right[1]*0.20-B.up[1]*0.14,
      P.z+B.dir[2]*0.42+B.right[2]*0.20-B.up[2]*0.14];
    const shot=(tx,ty,tz,scale,crit)=>{
      ftracers.push({ax:muzzle[0],ay:muzzle[1],az:muzzle[2],bx:tx,by:ty,bz:tz,life:0.10,max:0.10});
      if(ftracers.length>40)ftracers.splice(0,ftracers.length-40);
      return playerDmg(crit?2.5:1)*scale;
    };
    let end;
    if(hs.best)end=[hs.best.wx,hs.best.wy,hs.best.wz];
    else end=[P.x+B.dir[0]*16,P.y+B.dir[1]*16,P.z+B.dir[2]*16];
    if(hs.best){
      const crit=RNG()<0.12*UPG.crit;
      const dmg=shot(end[0],end[1],end[2],1,crit);
      damageThreat(hs.best,dmg);
      hitFlash=0.10;
      dmgList.push({x:hs.best.wx,y:hs.best.wy+0.42,z:hs.best.wz,
        txt:String(Math.round(dmg))+(crit?"!":""),life:0.6,max:0.6});
      if(dmgList.length>30)dmgList.splice(0,dmgList.length-30);
      /* SPLIT BARREL: ricochet into extra nearby threats */
      for(const th2 of nearbyThreats(B,hs.best,UPG.spread)){
        const d2=shot(th2.wx,th2.wy,th2.wz,0.6,false);
        damageThreat(th2,d2);
      }
    }else{
      shot(end[0],end[1],end[2],1,false);
    }
    recoil=1;
  }

  /* ---------- update (called from tick) ---------- */
  function update(dt){
    for(const t of ftracers)t.life-=dt;
    ftracers=ftracers.filter(t=>t.life>0);
    for(const d of dmgList)d.life-=dt;
    dmgList=dmgList.filter(d=>d.life>0);
    if(hitFlash>0)hitFlash-=dt;
    if(killPulse>0)killPulse-=dt;
    recoil=Math.max(0,recoil-dt*7);
    if(!active)return;
    if(playerCd>0)playerCd-=dt;

    if(autoplayOn){
      autoAimMove(dt);
    }else{
      const sp=((keys["ShiftLeft"]||keys["ShiftRight"])?7.2:4.3)*(1+0.14*UPG.speed);
      let mvF=(keys["KeyW"]?1:0)-(keys["KeyS"]?1:0);
      let mvR=(keys["KeyD"]?1:0)-(keys["KeyA"]?1:0);
      const cy=Math.cos(P.yaw),sy=Math.sin(P.yaw);
      const fwd=[sy,0,-cy], rgt=[cy,0,sy];
      let dx=(mvF*fwd[0]+mvR*rgt[0])*sp*dt;
      let dz=(mvF*fwd[2]+mvR*rgt[2])*sp*dt;
      if(dx||dz){
        P.x+=dx;P.z+=dz;
        walkAmt=Math.min(1,walkAmt+dt*6);
      }else walkAmt=Math.max(0,walkAmt-dt*6);
    }
    collide();
    bobPhase+=dt*(walkAmt>0?9:1.4);
    swayX+=(-(P.yaw-aimPrevYaw)*900-swayX)*Math.min(1,dt*10);
    swayY+=(-(P.pitch-aimPrevPitch)*900-swayY)*Math.min(1,dt*10);
    aimPrevYaw=P.yaw;aimPrevPitch=P.pitch;
    if((firing||keys["Space"])&&!autoplayOn)fire();
  }
  let aimPrevYaw=P.yaw, aimPrevPitch=P.pitch;

  function autoAimMove(dt){
    /* orbit the core slowly + aim at nearest live threat + auto-fire */
    autoA+=dt*0.35;
    const tx=Math.sin(autoA)*3.9, tz=Math.cos(autoA)*3.9;
    P.x+=(tx-P.x)*Math.min(1,dt*1.6);
    P.z+=(tz-P.z)*Math.min(1,dt*1.6);
    walkAmt=Math.min(1,walkAmt+dt*3);
    let best=null,bd=1e9;
    for(const th of S.threats){
      if(th.phase==="dying")continue;
      const dx=th.wx-P.x,dz=th.wz-P.z;
      const d=dx*dx+dz*dz;
      if(d<bd){bd=d;best=th;}
    }
    if(best){
      const dx=best.wx-P.x,dy=best.wy-P.y,dz=best.wz-P.z;
      const wantYaw=Math.atan2(dx,-dz);
      const wantPitch=Math.atan2(dy,Math.hypot(dx,dz));
      let dyaw=((wantYaw-P.yaw+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
      P.yaw+=dyaw*Math.min(1,dt*7);
      P.pitch+=(wantPitch-P.pitch)*Math.min(1,dt*7);
      if(Math.abs(dyaw)<0.12)fire();
    }
  }

  const PRAD=0.34;
  function collide(){
    /* keep inside the city */
    const b=CITY.bound-PRAD;
    P.x=Math.max(-b,Math.min(b,P.x));
    P.z=Math.max(-b,Math.min(b,P.z));
    /* player circle vs building AABBs */
    for(const c of colliders){
      const qx=Math.max(c.x0,Math.min(P.x,c.x1));
      const qz=Math.max(c.z0,Math.min(P.z,c.z1));
      const dx=P.x-qx, dz=P.z-qz, d2=dx*dx+dz*dz;
      if(d2<PRAD*PRAD){
        if(d2>1e-8){
          const dd=Math.sqrt(d2), pu=PRAD-dd;
          P.x+=dx/dd*pu; P.z+=dz/dd*pu;
        } else {
          const l=P.x-c.x0,r=c.x1-P.x,bo=P.z-c.z0,t=c.z1-P.z;
          const m=Math.min(l,r,bo,t);
          if(m===l)P.x=c.x0-PRAD; else if(m===r)P.x=c.x1+PRAD;
          else if(m===bo)P.z=c.z0-PRAD; else P.z=c.z1+PRAD;
        }
      }
    }
    /* solid core rig box */
    const bx=0.9,bz=1.4,rad=0.35;
    if(Math.abs(P.x)<bx+rad&&Math.abs(P.z)<bz+rad){
      const ox=(bx+rad)-Math.abs(P.x), oz=(bz+rad)-Math.abs(P.z);
      if(ox<oz)P.x+=(P.x<0?-1:1)*ox; else P.z+=(P.z<0?-1:1)*oz;
    }
  }

  /* ---------- render ---------- */
  function texTri(g,tex,pts,uv,shade,fog){
    const tris=pts.length===4?[[0,1,2],[0,2,3]]:[[0,1,2]];
    for(const tr of tris){
      const S0=pts[tr[0]],S1=pts[tr[1]],S2=pts[tr[2]];
      const T0=[uv[tr[0]][0]*tex.width,uv[tr[0]][1]*tex.height];
      const T1=[uv[tr[1]][0]*tex.width,uv[tr[1]][1]*tex.height];
      const T2=[uv[tr[2]][0]*tex.width,uv[tr[2]][1]*tex.height];
      const d=(T1[0]-T0[0])*(T2[1]-T0[1])-(T2[0]-T0[0])*(T1[1]-T0[1]);
      if(Math.abs(d)<1e-6)continue;
      const a=((S1[0]-S0[0])*(T2[1]-T0[1])-(S2[0]-S0[0])*(T1[1]-T0[1]))/d;
      const cc=((T1[0]-T0[0])*(S2[0]-S0[0])-(T2[0]-T0[0])*(S1[0]-S0[0]))/d;
      const e=S0[0]-a*T0[0]-cc*T0[1];
      const bb=((S1[1]-S0[1])*(T2[1]-T0[1])-(S2[1]-S0[1])*(T1[1]-T0[1]))/d;
      const dd=((T1[0]-T0[0])*(S2[1]-S0[1])-(T2[0]-T0[0])*(S1[1]-S0[1]))/d;
      const ff=S0[1]-bb*T0[0]-dd*T0[1];
      g.save();
      g.beginPath();g.moveTo(S0[0],S0[1]);g.lineTo(S1[0],S1[1]);g.lineTo(S2[0],S2[1]);g.closePath();
      g.clip();
      g.setTransform(a,bb,cc,dd,e,ff);
      g.imageSmoothingEnabled=false;
      g.drawImage(tex,0,0);
      g.restore();
      if(shade!=null||fog>0){
        g.save();
        g.beginPath();g.moveTo(S0[0],S0[1]);g.lineTo(S1[0],S1[1]);g.lineTo(S2[0],S2[1]);g.closePath();
        g.clip();
        if(shade!=null&&shade<1){g.fillStyle="rgba(0,0,0,"+((1-shade)*0.9).toFixed(3)+")";g.fill();}
        if(fog>0){g.fillStyle="rgba(4,12,18,"+fog.toFixed(3)+")";g.fill();}
        g.restore();
      }
    }
  }

  function dither(){
    const im=bg.getImageData(0,0,W,H), d=im.data, step=255/31;
    for(let y=0;y<H;y++){const yy=(y&3)*4;
      for(let x=0;x<W;x++){
        const o=(y*W+x)*4;
        const th=(BAYER[yy+(x&3)]/16-0.5)*step;
        for(let c=0;c<3;c++){
          let v=d[o+c]+th; if(v<0)v=0; else if(v>255)v=255;
          d[o+c]=(v/step|0)*step;
        }
      }
    }
    bg.putImageData(im,0,0);
  }

  function render(dt){
    /* ---- build the enemy draw list from live threats ---- */
    const draws=[];
    for(const th of S.threats){
      const dying=th.phase==="dying";
      const dp=dying?1-(th.dieT/0.42):0;
      const prog=Math.min(1,Math.max(0,(SPAWN_R-th.r)/(SPAWN_R-CONTACT_R)));
      const sc=THREAT_SCALE*(th.hpKind==="hacker"?0.9:1.0)*(0.80+0.20*prog)*(dying?1+0.95*dp:1);
      draws.push({mesh:th.hpKind==="hacker"?1:0,wx:th.wx,wy:th.wy,wz:th.wz,
        spin:th.spin,s:sc,fade:dying?Math.min(1,dp*1.05):0});
    }
    alive=draws.length;

    /* ---- real 3D world via WebGL ---- */
    GLWorld.draw({x:P.x,y:P.y,z:P.z,yaw:P.yaw,pitch:P.pitch}, draws, TRACERS.length?ftracers.concat(TRACERS):ftracers);

    /* ---- 2D retro HUD overlay ---- */
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,W,H);

    /* enemy HP bars projected into the HUD space */
    for(const th of S.threats){
      if(th.phase==="dying")continue;
      const pct=Math.max(0,th.hp/th.maxHp);
      if(pct>=0.999)continue;
      const pr=GLWorld.project(th.wx,th.wy+(th.hpKind==="hacker"?0.30:0.42),th.wz);
      if(!pr.vis)continue;
      const sx=(pr.x*0.5+0.5)*W, sy=(0.5-pr.y*0.5)*H;
      const w2=Math.max(8,Math.min(30,pr.k*0.06*W*0.32)), h2=2;
      const x0=Math.round(sx-w2/2), y0=Math.round(sy);
      ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(x0-1,y0-1,w2+2,h2+2);
      ctx.fillStyle=th.hpKind==="hacker"?"#ffcf4d":"#ff4d6a";
      ctx.fillRect(x0,y0,Math.max(1,Math.round(w2*pct)),h2);
    }
    /* floating damage numbers */
    for(const d of dmgList){
      const pr=GLWorld.project(d.x,d.y,d.z);
      if(!pr.vis)continue;
      ctx.globalAlpha=Math.max(0,d.life/d.max);
      ctx.fillStyle="#ffe07a";ctx.font="bold 9px ui-monospace,monospace";
      ctx.fillText(d.txt,(pr.x*0.5+0.5)*W,(0.5-pr.y*0.5)*H);
      ctx.globalAlpha=1;
    }

    /* low-integrity glitch flash */
    if(S.integrity<33&&shakeT>0){
      ctx.fillStyle="rgba(255,60,80,"+(0.10+Math.random()*0.10).toFixed(2)+")";
      ctx.fillRect(0,0,W,H);
    }
    drawViewModel();
    drawHud();
  }

  function drawViewModel(){
    const s=H/210;
    const bobX=Math.sin(bobPhase)*6*walkAmt+swayX*0.9;
    const bobY=Math.abs(Math.cos(bobPhase))*5*walkAmt+swayY*0.9;
    const r=recoil*10;
    ctx.save();
    ctx.translate(W*0.78+bobX*s,H*0.92+bobY*s+r*s);
    ctx.scale(s,s);
    ctx.lineJoin="round";
    /* dark silhouette so the weapon reads against the floor */
    ctx.strokeStyle="rgba(0,0,0,.85)";ctx.lineWidth=3;
    const shapes=[
      [[-96,-72],[-24,-56],[-20,-40],[-98,-55]],          /* barrel */
      [[-58,-30],[6,-18],[14,16],[-46,6]],                /* body  */
      [[-34,4],[-4,9],[6,52],[-26,44]]                    /* grip  */
    ];
    for(const sh of shapes){ctx.beginPath();ctx.moveTo(sh[0][0],sh[0][1]);for(let i=1;i<sh.length;i++)ctx.lineTo(sh[i][0],sh[i][1]);ctx.closePath();ctx.fillStyle="rgba(3,10,14,.96)";ctx.fill();ctx.stroke();}
    /* barrel */
    ctx.fillStyle="#1d4a58";
    ctx.beginPath();ctx.moveTo(-96,-72);ctx.lineTo(-24,-56);ctx.lineTo(-20,-40);ctx.lineTo(-98,-55);ctx.closePath();ctx.fill();
    ctx.fillStyle="#2a5f70";ctx.fillRect(-92,-70,16,9);
    /* body */
    ctx.fillStyle="#245566";
    ctx.beginPath();ctx.moveTo(-58,-30);ctx.lineTo(6,-18);ctx.lineTo(14,16);ctx.lineTo(-46,6);ctx.closePath();ctx.fill();
    /* top rim highlight */
    ctx.strokeStyle="rgba(150,235,250,.55)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-58,-30);ctx.lineTo(6,-18);ctx.stroke();
    /* grip / hand */
    ctx.fillStyle="#12333f";
    ctx.beginPath();ctx.moveTo(-34,4);ctx.lineTo(-4,9);ctx.lineTo(6,52);ctx.lineTo(-26,44);ctx.closePath();ctx.fill();
    /* cyan accents */
    ctx.fillStyle="#7df0ff";
    ctx.fillRect(-40,-22,14,4);
    ctx.fillRect(-18,-6,14,4);
    ctx.fillRect(-78,-64,10,3);
    /* muzzle flash */
    if(recoil>0.2){
      ctx.fillStyle="rgba(190,248,255,"+(recoil*0.95).toFixed(2)+")";
      ctx.beginPath();ctx.arc(-96,-62,9,0,6.2832);ctx.fill();
      ctx.fillStyle="rgba(120,220,255,"+(recoil*0.5).toFixed(2)+")";
      ctx.beginPath();ctx.arc(-96,-62,15,0,6.2832);ctx.fill();
    }
    ctx.restore();
  }

  function drawHud(){
    const g=ctx;
    /* crosshair */
    const cx=W/2,cy=H/2;
    g.strokeStyle="rgba(140,240,255,.9)";g.lineWidth=1;
    g.beginPath();g.moveTo(cx-9,cy);g.lineTo(cx-3,cy);g.moveTo(cx+3,cy);g.lineTo(cx+9,cy);
    g.moveTo(cx,cy-9);g.lineTo(cx,cy-3);g.moveTo(cx,cy+3);g.lineTo(cx,cy+9);g.stroke();
    g.fillStyle="rgba(140,240,255,.9)";g.fillRect(cx,cy,1,1);
    if(hitFlash>0){
      g.strokeStyle="rgba(255,90,110,"+hitFlash/0.10+")";g.lineWidth=2;
      g.beginPath();g.moveTo(cx-8,cy-8);g.lineTo(cx-3,cy-3);g.moveTo(cx+8,cy-8);g.lineTo(cx+3,cy-3);
      g.moveTo(cx-8,cy+8);g.lineTo(cx-3,cy+3);g.moveTo(cx+8,cy+8);g.lineTo(cx+3,cy+3);g.stroke();
    }
    /* integrity bar (bottom-left) */
    const ip=Math.max(0,Math.min(100,S.integrity));
    const bw=Math.round(W*0.30),bx=10,by=H-16;
    g.fillStyle="rgba(0,0,0,.5)";g.fillRect(bx-1,by-1,bw+2,8);
    g.fillStyle=ip<33?"#ff5c6a":(ip<66?"#ffcf4d":"#3dffa2");
    g.fillRect(bx,by,Math.round(bw*ip/100),6);
    g.fillStyle="#dff8ff";g.font="bold 8px ui-monospace,monospace";
    g.fillText("INTEGRITY "+ip.toFixed(0)+"%",bx,by-4);
    /* top-left info */
    g.fillStyle="#8fe8ff";g.font="bold 9px ui-monospace,monospace";
    g.fillText("SENTINEL-9 // WAVE "+S.wave,10,14);
    g.fillStyle="#ffcf4d";
    g.fillText("THREATS "+S.threats.length+"   DPS "+fmt(threatDps()),10,26);
    /* top-right */
    g.fillStyle="#3dffa2";g.font="9px ui-monospace,monospace";
    const t1="SPAWNED "+S.spawned+"/"+S.quota;
    g.fillText(t1,W-10-g.measureText(t1).width,14);
    const t2="KILLS "+S.kills;
    g.fillText(t2,W-10-g.measureText(t2).width,26);
    /* phase banner + hint */
    let hint;
    if(S.phase==="choose"){
      g.fillStyle="#3dffa2";g.font="bold 10px ui-monospace,monospace";
      const head="UPGRADE READY  \u2014  READ THE CORE SCREEN";
      g.fillText(head,(W-g.measureText(head).width)/2,42);
      g.font="9px ui-monospace,monospace";g.fillStyle="#dff8ff";
      const opts=(S.choices||[]).map((c,i)=>"["+(i+1)+"] "+c.name).join("   ");
      g.fillText(opts,(W-g.measureText(opts).width)/2,58);
      hint="PRESS 1 / 2 / 3 TO INSTALL AN UPGRADE";
    }else{
      hint=locked?"WASD MOVE  \u00b7  MOUSE AIM  \u00b7  CLICK FIRE  \u00b7  ESC RELEASE":"CLICK TO CAPTURE MOUSE  \u00b7  WASD MOVE  \u00b7  SHOOT THE VIRUSES BEFORE THEY REACH THE CORE";
    }
    g.fillStyle="rgba(140,200,215,.65)";g.font="8px ui-monospace,monospace";
    g.fillText(hint,(W-g.measureText(hint).width)/2,H-6);
  }

  /* ---------- resize ---------- */
  function resize(){
    const vw=window.innerWidth,vh=window.innerHeight;
    let h=Math.round(vh*0.52);h=Math.max(220,Math.min(560,h));
    let w=Math.round(h*vw/vh);w=Math.max(320,Math.min(980,w));
    W=w;H=h;
    cv.width=W;cv.height=H;
    back.width=W;back.height=H;
    FOC=(H/2)/Math.tan((78*Math.PI/180)/2);
  }
  resize();

  /* ---------- mode toggle + input ---------- */
  function setActive(v){
    active=!!v;
    const ov=document.getElementById("fps");
    if(ov)ov.classList.toggle("on",active);
    if(active){resize();}
    else if(document.pointerLockElement)document.exitPointerLock();
  }
  function toggle(){setActive(!active);}

  cv.addEventListener("click",()=>{ if(active&&!locked&&cv.requestPointerLock)cv.requestPointerLock(); });
  document.addEventListener("pointerlockchange",()=>{ locked=(document.pointerLockElement===cv); });
  window.addEventListener("mousemove",e=>{
    if(!active||!locked)return;
    P.yaw+=e.movementX*SENS;
    P.pitch-=e.movementY*SENS;
    P.pitch=Math.max(-PITCH_MAX,Math.min(PITCH_MAX,P.pitch));
  });
  window.addEventListener("mousedown",e=>{ if(active){ firing=true; if(!locked&&cv.requestPointerLock)cv.requestPointerLock(); } });
  window.addEventListener("mouseup",()=>{ firing=false; });
  window.addEventListener("keydown",e=>{
    keys[e.code]=true;
    if(!e.repeat&&S.phase==="choose"){
      if(e.code==="Digit1"||e.code==="Numpad1"){pickUpgrade(0);}
      else if(e.code==="Digit2"||e.code==="Numpad2"){pickUpgrade(1);}
      else if(e.code==="Digit3"||e.code==="Numpad3"){pickUpgrade(2);}
    }
    if((e.code==="KeyF"||e.code==="Escape")&&!e.repeat){ if(document.pointerLockElement)document.exitPointerLock(); }
    if(active&&["KeyW","KeyA","KeyS","KeyD","Space","ShiftLeft","ShiftRight","ArrowUp","ArrowDown"].indexOf(e.code)>=0)e.preventDefault();
  });
  window.addEventListener("keyup",e=>{ keys[e.code]=false; });
  window.addEventListener("resize",()=>{ if(active)resize(); });

  return{
    isActive:()=>active, setActive:setActive, toggle:toggle, update:update, render:render, resize:resize,
    get P(){return P;}, fire:fire, hitscan:hitscan, collide:collide,
    get enemies(){return alive;}, get tracers(){return ftracers.length;}, get damage(){return dmgList.length;}
  };
})();


/* ===================== LOOP ===================== */
let last=performance.now();
function tick(dt){
  if(S.over)return;
  S.t+=dt;
  stepThreats(dt);
  stepWeapons(dt);
  FPS.update(dt);
  updatePhase(dt);
  for(const t of TRACERS)t.life-=dt;
  TRACERS=TRACERS.filter(t=>t.life>0);
}
function frame(now){
  let dt=(now-last)/1000;last=now;if(dt>0.25)dt=0.25;dt*=SPEED;
  tick(dt);
  updateCoreFx(dt);
  FPS.render(dt);
  Screen.tick();
  requestAnimationFrame(frame);
}

/* ===================== INIT ===================== */
/* first-person view is the game */
FPS.setActive(true);
last=performance.now();
requestAnimationFrame(frame);
window.addEventListener("resize",()=>FPS.resize());

/* headless probe (opt-in via ?probe=1): dumps state into the DOM */
if(params.get("probe")){
  setInterval(()=>{
    let p=document.getElementById("probe");
    if(!p){p=document.createElement("pre");p.id="probe";p.style.cssText="position:fixed;left:-9999px";document.body.appendChild(p);}
    p.textContent=JSON.stringify({t:+S.t.toFixed(1),integrity:+S.integrity.toFixed(1),kills:S.kills,
      wave:S.wave,phase:S.phase,quota:S.quota,spawned:S.spawned,
      choices:S.choices?S.choices.map(c=>c.id):null,upg:Object.assign({},UPG),
      threats:S.threats.length,phases:S.threats.map(t=>t.phase),over:S.over,
      fpsActive:FPS.isActive(),enemies:FPS.enemies,gl:!!(typeof GLWorld!=="undefined"&&GLWorld.ok)});
  },200);
}
window.__game={get state(){return S;},get upg(){return UPG;},spawnThreat,stepThreats,stepWeapons,damageThreat,tick,fps:FPS,redeploy,gameOver,
  pickUpgrade,beginChoose,rollUpgrades,screen:Screen,
  get glOK(){try{return GLWorld.ok;}catch(e){return false;}},
  get glDebug(){try{return GLWorld._debug();}catch(e){return {err:String(e)};}},
  get coreTracers(){return TRACERS;},
  get glCtx(){try{return GLWorld._gl();}catch(e){return null;}},
  get glCanvas(){return document.getElementById("glCanvas");},
  stepFull(dt){tick(dt);updateCoreFx(dt);FPS.render(dt);Screen.tick();}};

</script>
</body>
