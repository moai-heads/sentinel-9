<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS-7 // MAINFRAME</title>
<style>
:root{
  --bg:#070707; --panel:#0d0d0f; --panel2:#111116; --line:#20202a;
  --amber:#ffb000; --amber-dim:#8a6200; --grn:#39ff88; --red:#ff4747;
  --cyan:#5ad7ff; --mag:#d47bff; --txt:#c9b98c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:13px/1.45 "SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  overflow:hidden; letter-spacing:.02em;
}
#crt,#vig{position:fixed;inset:0;pointer-events:none;z-index:99}
#crt{background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.28) 2px 3px);mix-blend-mode:multiply;opacity:.55}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.75) 100%)}
#app{height:100%;display:flex;flex-direction:column;padding:10px 12px;gap:9px}

header{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:7px}
.brand{color:var(--amber);font-weight:700;letter-spacing:.14em;text-shadow:0 0 10px rgba(255,176,0,.5)}
.brand b{color:var(--grn)}
.cur{margin-left:auto;text-align:right;line-height:1.1}
.cur .n{font-size:26px;color:var(--grn);text-shadow:0 0 12px rgba(57,255,136,.45);font-weight:700}
.cur .r{font-size:11px;color:var(--amber-dim)}
.cur .lbl{font-size:10px;color:#6a5b34;letter-spacing:.2em}

main{flex:1;display:grid;grid-template-columns:1.08fr .92fr;gap:9px;min-height:0}
.col{display:flex;flex-direction:column;gap:9px;min-height:0}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:3px;padding:9px 10px;position:relative}
.panel h2{font-size:10px;letter-spacing:.22em;color:var(--amber-dim);font-weight:600;margin-bottom:7px;text-transform:uppercase}
.panel h2:before{content:"// ";color:#4a3d1c}

/* actions */
.actions{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
button{
  font:inherit;cursor:pointer;background:#141419;color:var(--amber);
  border:1px solid #33333f;border-radius:3px;padding:9px 8px;text-transform:uppercase;
  letter-spacing:.09em;font-size:12px;transition:.08s;position:relative;
}
button:hover:not(:disabled){background:#1d1d25;border-color:var(--amber);box-shadow:0 0 12px rgba(255,176,0,.22) inset}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.35;cursor:not-allowed}
button.big{font-size:15px;font-weight:700;color:#0a0a0a;background:var(--amber);border-color:var(--amber);padding:12px 8px}
button.big:hover{background:#ffc633;box-shadow:0 0 20px rgba(255,176,0,.55)}
button.danger{color:var(--red);border-color:#40222a}
button.danger:hover{border-color:var(--red);box-shadow:0 0 12px rgba(255,71,71,.25) inset}
button.go{color:var(--grn);border-color:#1f4030}
button.go:hover{border-color:var(--grn)}
.actions button .sub{display:block;font-size:10px;opacity:.8;margin-top:2px;text-transform:none;letter-spacing:.03em}

/* shop */
.shop{display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1;min-height:0;padding-right:2px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:3px;background:#0b0b0e;cursor:pointer;transition:.08s}
.row:hover{border-color:#3a3a48;background:#101016}
.row.can{border-color:var(--grn);background:#0c1410}
.row.can:hover{box-shadow:0 0 14px rgba(57,255,136,.13)}
.row.locked{opacity:.4}
.row .nm{color:var(--amber);font-size:12px;letter-spacing:.06em}
.row .sub{font-size:10.5px;color:#6a5b34;margin-top:2px}
.row .right{text-align:right;min-width:104px}
.row .own{font-size:17px;color:var(--grn);font-weight:700}
.row .cost{font-size:11px;color:var(--txt)}
.row.can .cost{color:var(--grn)}
.row .cost.no{color:var(--red)}

/* threat */
.threat .bar{height:16px;background:#120a0a;border:1px solid #33202a;border-radius:2px;overflow:hidden;position:relative}
.threat .fill{height:100%;width:0%;background:linear-gradient(90deg,#6a1a1a,var(--red));transition:width .18s;box-shadow:0 0 14px rgba(255,71,71,.5)}
.threat .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;text-shadow:0 0 4px #000;letter-spacing:.2em}
.threat.warn .fill{background:linear-gradient(90deg,#6a5a1a,#ffb000)}
.threat .rate{font-size:10.5px;color:#7a5a5a;margin-top:5px;display:flex;justify-content:space-between}

/* network */
.net{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.cell{aspect-ratio:1;background:#0f0f13;border:1px solid #1b1b22;border-radius:1px;transition:.4s}
.cell.on{background:var(--grn);border-color:var(--grn);box-shadow:0 0 7px rgba(57,255,136,.6)}
.cell.warm{background:#2a4a1a;border-color:#3a5a1a}

/* log */
.log{font-size:11px;line-height:1.6;overflow-y:auto;flex:1;min-height:0;color:#8a7a55}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .ok{color:var(--grn)} .log .bad{color:var(--red)} .log .hi{color:var(--amber)} .log .cy{color:var(--cyan)}
.log .t{color:#4a3d1c}

canvas{width:100%;display:block;height:52px}
.foot{display:flex;gap:14px;font-size:10px;color:#5a4d2a;border-top:1px solid var(--line);padding-top:6px}
.foot b{color:var(--amber)}
.foot .sp{margin-left:auto}
.upgrow{display:flex;gap:6px;flex-wrap:wrap}
.upg{flex:1 1 46%;display:flex;justify-content:space-between;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:3px;background:#0b0b0e;cursor:pointer;font-size:11px}
.upg:hover{border-color:#3a3a48}
.upg.can{border-color:var(--cyan)}
.upg .c{color:var(--cyan)} .upg.can .c{color:var(--grn)}
.upg .n{color:var(--amber)}
.overlay{position:fixed;inset:0;background:rgba(3,3,3,.86);display:flex;align-items:center;justify-content:center;z-index:120;backdrop-filter:blur(2px)}
.overlay .box{border:1px solid var(--amber-dim);background:#0a0a0c;padding:26px 34px;text-align:center;max-width:560px;box-shadow:0 0 60px rgba(0,0,0,.9)}
.overlay h1{color:var(--amber);font-size:22px;letter-spacing:.2em;margin-bottom:12px;text-shadow:0 0 14px rgba(255,176,0,.5)}
.overlay p{color:var(--txt);font-size:12.5px;line-height:1.9;margin-bottom:8px}
.overlay .k{color:var(--grn)}
.hide{display:none}
</style>
</head>
<body>
<div id="crt"></div><div id="vig"></div>

<div id="app">
  <header>
    <div class="brand">NEXUS-7 <b>//</b> MAINFRAME <span id="cursor">_</span></div>
    <div class="cur">
      <div class="lbl">COMPUTE CYCLES</div>
      <div class="n" id="cycles">0</div>
      <div class="r" id="rate">0/s</div>
    </div>
  </header>

  <main>
    <div class="col">
      <div class="panel">
        <h2>Operator Console</h2>
        <div class="actions">
          <button class="big" id="exec">Execute<span class="sub" id="execGain"></span></button>
          <button class="go" id="scrub">Scrub Logs<span class="sub" id="scrubCost"></span></button>
          <button class="danger" id="reboot">Reboot<span class="sub" id="rebootGain"></span></button>
        </div>
      </div>

      <div class="panel" style="flex:1;display:flex;flex-direction:column;min-height:0">
        <h2>Node Fabrication</h2>
        <div class="shop" id="shop"></div>
      </div>

      <div class="panel">
        <h2>Kernel Modules</h2>
        <div class="upgrow" id="upgrades"></div>
      </div>
    </div>

    <div class="col">
      <div class="panel threat" id="threatPanel">
        <h2>Trace Level</h2>
        <div class="bar"><div class="fill" id="traceFill"></div><div class="pct" id="tracePct">0%</div></div>
        <div class="rate"><span id="traceRate">+0.0%/s</span><span id="shieldInfo"></span></div>
      </div>

      <div class="panel">
        <h2>Network Topology</h2>
        <div class="net" id="net"></div>
      </div>

      <div class="panel">
        <h2>Signal Spectrum</h2>
        <canvas id="scope"></canvas>
      </div>

      <div class="panel" style="flex:1;display:flex;flex-direction:column;min-height:0">
        <h2>System Log</h2>
        <div class="log" id="log"></div>
      </div>

      <div class="foot">
        <span>KERNELS <b id="kernels">0</b></span>
        <span>REBOOTS <b id="reboots">0</b></span>
        <span>TRACED <b id="caught">0</b></span>
        <span class="sp" id="savestate">—</span>
      </div>
    </div>
  </main>
</div>

<div class="overlay hide" id="overlay">
  <div class="box">
    <h1 id="ovTitle">NEXUS-7</h1>
    <div id="ovBody"></div>
    <p style="margin-top:16px"><span class="k" id="ovHint">PRESS ENTER</span></p>
  </div>
</div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const UNITS=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','UDc','DDc'];
function fmt(n){
  if(n<0) return '-'+fmt(-n);
  if(n<1000) return (n<10 && n%1!==0)?n.toFixed(1):Math.floor(n).toString();
  let u=0; while(n>=1000 && u<UNITS.length-1){n/=1000;u++;}
  return n.toFixed(n<10?2:n<100?1:0)+UNITS[u];
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- content tables ---------- */
const GENS=[
  {id:'core',   name:'CORE UNIT',       base:0.6,  cost:15,     growth:1.150},
  {id:'cluster',name:'CLUSTER NODE',    base:5,    cost:180,    growth:1.165},
  {id:'array',  name:'ARRAY SEGMENT',   base:38,   cost:2600,   growth:1.180},
  {id:'nexus',  name:'NEXUS ROUTER',    base:260,  cost:42000,  growth:1.200},
  {id:'sing',   name:'SINGULARITY CORE',base:2100, cost:750000, growth:1.225},
];
const UPGRADES=[
  {id:'clock', name:'OVERCLOCK',   desc:'output x1.5',      cost:l=>800*Math.pow(8,l),      max:99, mult:(s,l)=>Math.pow(1.5,l)},
  {id:'shield',name:'FIREWALL',    desc:'trace rate -10%',  cost:l=>400*Math.pow(5,l),      max:12, mult:(s,l)=>Math.pow(0.9,l)},
  {id:'comp',  name:'COMPILER',    desc:'output x2',        cost:l=>6000*Math.pow(15,l),    max:8,  mult:(s,l)=>Math.pow(2,l)},
  {id:'thread',name:'HYPER-THREAD',desc:'output x3',        cost:l=>120000*Math.pow(20,l),  max:6,  mult:(s,l)=>Math.pow(3,l)},
  {id:'auto',  name:'AUTO-SCRUB',  desc:'scrub at 70% trace',cost:l=>25000,                 max:1,  mult:(s,l)=>1},
];
const flavor=[
  ['INITIALISING KERNEL SUBSYSTEMS...','ok'],
  ['NODE HANDSHAKE ACCEPTED','cy'],
  ['HEURISTIC ROUTING ONLINE','cy'],
  ['PACKET FRAGMENTATION MITIGATED',''],
  ['ENTROPY POOL REFILLED',''],
  ['MEMORY PAGE 0x7F2A WRITTEN',''],
];

/* ---------- state ---------- */
const SAVE='nexus7_save_v1';
let S={
  cycles:0, total:0, kernels:0, trace:0, caught:0, reboots:0,
  owned:GENS.map(()=>0),
  upg:Object.fromEntries(UPGRADES.map(u=>[u.id,0])),
  scrubs:0, last:Date.now(), playtime:0, milestones:{}, spawn:0
};
const params=new URLSearchParams(location.search);
const SPEED=Math.max(0.1,parseFloat(params.get('speed'))||1);

/* ---------- economy ---------- */
function rawProd(){ return GENS.reduce((p,g,i)=>p+S.owned[i]*g.base,0); }
function mult(){ return UPGRADES.reduce((m,u)=>m*u.mult(S,S.upg[u.id]),1)*(1+0.10*S.kernels); }
function prod(){ return rawProd()*mult(); }
function cost(i){ return GENS[i].cost*Math.pow(GENS[i].growth,S.owned[i]); }
function upgCost(u){ return u.cost(S.upg[u.id]); }
function traceRate(){
  if(S.total<80) return 0;
  let r=(0.20+0.014*prod());
  r*=UPGRADES[1].mult(S,S.upg.shield);
  r*=Math.pow(0.97,S.kernels);
  return r;
}
function scrubCost(){ return 20+6*rawProd(); }
function execGain(){ return Math.max(1,prod()*0.03); }
function kernelGain(){ return Math.floor(Math.sqrt(S.total/5000)); }
function netGain(){ return Math.max(0,kernelGain()-S.kernels); }

/* ---------- log ---------- */
const logEl=()=>$('#log');
function log(msg,cls){
  const el=logEl(); const d=document.createElement('div');
  const ts=new Date().toTimeString().slice(0,8);
  d.innerHTML='<span class="t">['+ts+']</span> <span class="'+(cls||'')+'">'+msg+'</span>';
  el.prepend(d); while(el.children.length>70) el.lastChild.remove();
}

/* ---------- build UI ---------- */
const rows=GENS.map((g,i)=>{
  const el=document.createElement('div'); el.className='row';
  el.innerHTML='<div><div class="nm">'+g.name+'</div><div class="sub">+'+fmt(g.base)+'/s each · '+fmt(g.cost)+' base</div></div>'+
    '<div class="right"><div class="own">0</div><div class="cost">'+fmt(g.cost)+'</div></div>';
  el.onclick=()=>buy(i);
  $('#shop').appendChild(el);
  return {el,own:el.querySelector('.own'),cost:el.querySelector('.cost'),sub:el.querySelector('.sub')};
});
const upgRows=UPGRADES.map(u=>{
  const el=document.createElement('div'); el.className='upg';
  el.innerHTML='<span><span class="n">'+u.name+'</span> <span class="c"></span></span><span class="d"></span>';
  el.onclick=()=>buyUpg(u.id);
  $('#upgrades').appendChild(el);
  return {el,c:el.querySelector('.c'),d:el.querySelector('.d')};
});
const cells=[];
for(let i=0;i<60;i++){ const c=document.createElement('div'); c.className='cell'; $('#net').appendChild(c); cells.push(c); }

/* ---------- actions ---------- */
function exec(e){
  S.cycles+=execGain(); S.total+=execGain();
  S.trace=clamp(S.trace+0.08,0,100);
  float(e,'+'+fmt(execGain()));
}
function buy(i){
  const c=cost(i); if(S.cycles<c) return;
  S.cycles-=c; S.owned[i]++;
  beep(660,.04,.05);
  if(S.owned[i]===1) log('NODE ONLINE: '+GENS[i].name,'ok');
  if(S.owned[i]===10) log('FABRICATION SCALED: 10x '+GENS[i].name,'hi');
  render();
}
function buyUpg(id){
  const u=UPGRADES.find(x=>x.id===id); if(!u) return;
  if(S.upg[id]>=u.max) return;
  const c=upgCost(u); if(S.cycles<c) return;
  S.cycles-=c; S.upg[id]++; beep(880,.05,.06);
  log('MODULE LOADED: '+u.name+' L'+S.upg[id],'hi');
  render();
}
function scrub(){
  const c=scrubCost(); if(S.cycles<c) return;
  S.cycles-=c; S.scrubs++;
  const before=S.trace; S.trace=Math.max(0,S.trace-Math.max(20,S.trace*0.5));
  beep(300,.07,.05);
  log('LOG SCRUB — trace '+before.toFixed(0)+'% -> '+S.trace.toFixed(0)+'%','cy');
}
function reboot(forced){
  const gain=netGain();
  if(!forced && gain<=0){ log('REBOOT AVAILABLE AT 5000 CYCLES',''); return; }
  if(!forced && !confirm('REBOOT MAINFRAME?\nGain '+gain+' KERNEL(S). All nodes & modules reset.')) return;
  const totalBefore=S.total;
  if(gain>0) S.kernels+=gain;
  S.reboots++;
  log((forced?'*** CONNECTION SEVERED — TRACE COMPLETE ***':'*** MANUAL REBOOT ***'),'bad');
  log('KERNEL ACQUIRED x'+gain+' — total '+S.kernels+' (all output +'+fmt(S.kernels*10)+'%)','hi');
  S.cycles=0; S.total=0; S.trace=0; S.scrubs=0; S.owned=GENS.map(()=>0);
  S.upg=Object.fromEntries(UPGRADES.map(u=>[u.id,0]));
  S.milestones={}; S.reboots===1&&log('NEW IMAGE DEPLOYED — production restored','ok');
  render(); save();
}

/* ---------- juice ---------- */
function float(e,text){
  const x=(e&&e.clientX)||0, y=(e&&e.clientY)||0;
  if(!x) return;
  const d=document.createElement('div');
  d.textContent=text;
  d.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;color:#39ff88;font-weight:700;pointer-events:none;z-index:200;transition:all .7s;font-size:13px;text-shadow:0 0 8px rgba(57,255,136,.7)';
  document.body.appendChild(d);
  requestAnimationFrame(()=>{d.style.transform='translateY(-34px)';d.style.opacity='0';});
  setTimeout(()=>d.remove(),720);
}
let actx=null;
function beep(freq,dur,vol){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='square'; o.frequency.value=freq;
    g.gain.value=vol||.04; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+(dur||.05));
  }catch(e){}
}

/* ---------- render ---------- */
function render(){
  $('#cycles').textContent=fmt(S.cycles);
  $('#rate').textContent=fmt(prod())+'/s';
  GENS.forEach((g,i)=>{
    const r=rows[i], c=cost(i), can=S.cycles>=c;
    r.own.textContent=S.owned[i];
    r.cost.textContent=fmt(c);
    r.cost.className='cost'+(can?'':' no');
    r.el.className='row'+(can?' can':'')+((S.total<g.cost*0.4&&S.owned[i]===0)?' locked':'');
    r.sub.textContent='+'+fmt(g.base*mult())+'/s each · '+fmt(S.owned[i]*g.base*mult())+'/s total';
  });
  UPGRADES.forEach((u,i)=>{
    const r=upgRows[i], lvl=S.upg[u.id], maxed=lvl>=u.max;
    r.c.textContent='L'+lvl+'/'+u.max;
    if(maxed){ r.el.className='upg'; r.d.textContent='MAX'; }
    else{
      const c=upgCost(u), can=S.cycles>=c;
      r.el.className='upg'+(can?' can':'');
      r.d.textContent=fmt(c)+' — '+u.desc;
    }
  });
  // threat
  const t=clamp(S.trace,0,100);
  $('#traceFill').style.width=t+'%';
  $('#tracePct').textContent=t.toFixed(0)+'%';
  $('#threatPanel').className='panel threat'+(t>60?' warn':'');
  $('#traceRate').textContent=(traceRate()>0?'+':'')+traceRate().toFixed(2)+'%/s';
  $('#shieldInfo').textContent=S.upg.shield>0?('FIREWALL L'+S.upg.shield):'';
  $('#execGain').textContent='+'+fmt(execGain());
  $('#scrubCost').textContent=fmt(scrubCost())+' cycles';
  const rg=netGain();
  $('#rebootGain').textContent=rg>0?('+'+rg+' KERNEL'+(rg>1?'S':'')):fmt(5000)+' total to reboot';
  $('#kernels').textContent=S.kernels;
  $('#reboots').textContent=S.reboots;
  $('#caught').textContent=S.caught;
  // net
  const lit=Math.min(cells.length,S.owned.reduce((a,b)=>a+b,0));
  cells.forEach((c,i)=>{ c.className='cell'+(i<lit?' on':(i<lit+6?' warm':'')); });
}

/* ---------- tick ---------- */
let acc=0;
function tick(dt){
  dt*=SPEED;
  S.playtime+=dt;
  const p=prod();
  if(p>0){ const gain=p*dt; S.cycles+=gain; S.total+=gain; }
  const tr=traceRate();
  if(tr>0) S.trace=clamp(S.trace+tr*dt,0,100);
  // auto scrub
  if(S.upg.auto>0 && S.trace>70 && S.cycles>=scrubCost()) scrub();
  // milestones
  checkMilestones();
  // caught
  if(S.trace>=100){ S.caught++; S.trace=100; reboot(true); }
  acc+=dt;
  // periodic ambient log
  S.spawn-=dt;
  if(S.spawn<=0){ S.spawn=6+Math.random()*10; const f=flavor[(Math.random()*flavor.length)|0]; log(f[0],f[1]); }
}
function checkMilestones(){
  const m=(k,cond,msg,cls)=>{ if(!S.milestones[k]&&cond){S.milestones[k]=1;log(msg,cls||'hi');} };
  m('c1',S.owned[0]>=1,'CORE UNIT ONLINE — passive compute established','ok');
  m('c10',S.owned[0]>=10,'FABRIC STABLE: 10 core units','hi');
  m('c25',S.owned[0]>=25,'OVERCLOCK TERRITORY: 25 core units','hi');
  m('clus',S.owned[1]>=1,'CLUSTER NODE deployed — throughput rising','ok');
  m('arr',S.owned[2]>=1,'ARRAY SEGMENT online — serious compute now','ok');
  m('nx',S.owned[3]>=1,'NEXUS ROUTER online — backbone saturated','hi');
  m('sg',S.owned[4]>=1,'SINGULARITY CORE online — you are the mainframe','hi');
  m('trace25',S.trace>=25,'WARNING: trace signatures detected','bad');
  m('trace60',S.trace>=60,'CRITICAL: adversary narrowing location','bad');
}

/* ---------- scope ---------- */
const cv=$('#scope'), cx=cv.getContext('2d');
function scope(ts){
  const w=cv.width=cv.clientWidth, h=cv.height=52;
  cx.clearRect(0,0,w,h);
  const amp=8+Math.min(22,Math.log10(1+prod())*6);
  const speed=(0.4+S.trace/60);
  cx.beginPath(); cx.lineWidth=1.4; cx.strokeStyle='#39ff88';
  for(let x=0;x<w;x++){
    const n=(Math.sin(x*0.09+ts*0.004*speed)*amp)+(Math.sin(x*0.31-ts*0.007*speed)*amp*0.5)+(Math.random()-0.5)*2;
    const y=h/2+n; x?cx.lineTo(x,y):cx.moveTo(x,y);
  }
  cx.stroke();
  cx.strokeStyle='rgba(255,71,71,'+Math.min(.5,S.trace/200)+')';
  cx.beginPath();
  for(let x=0;x<w;x++){
    const n=Math.sin(x*0.05-ts*0.003*(1+S.trace/30))*amp*1.2;
    const y=h/2+n; x?cx.lineTo(x,y):cx.moveTo(x,y);
  }
  cx.stroke();
}

/* ---------- save ---------- */
let saveFlash=0;
function save(){
  try{ localStorage.setItem(SAVE,JSON.stringify({S,ts:Date.now()})); }catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem(SAVE); if(!raw) return false;
    const d=JSON.parse(raw); if(!d||!d.S) return false;
    Object.assign(S,d.S);
    S.owned=GENS.map((g,i)=>S.owned[i]||0);
    S.upg=Object.assign(Object.fromEntries(UPGRADES.map(u=>[u.id,0])),S.upg||{});
    const off=Math.min((Date.now()-d.ts)/1000,3600*8);
    if(off>5){ const g=prod()*off; S.cycles+=g; S.total+=g; setTimeout(()=>log('OFFLINE '+Math.floor(off)+'s — recovered '+fmt(g)+' cycles','cy'),600); }
    return true;
  }catch(e){ return false; }
}

/* ---------- boot ---------- */
let started=false, over=false;
function bootOverlay(){
  $('#ovTitle').textContent='NEXUS-7 // MAINFRAME';
  $('#ovBody').innerHTML=
    'You are a rogue process, newly resident in a mainframe.<br>'+
    'Fabricate <span class="k">NODES</span> to generate compute <span class="k">CYCLES</span>.<br>'+
    'Spend cycles on <span class="k">MODULES</span> to multiply output.<br><br>'+
    'But activity raises your <span style="color:#ff4747">TRACE</span> level.<br>'+
    'Scrub the logs, or be found. At 100% you are severed —<br>'+
    'yet each severance yields a <span class="k">KERNEL</span>, permanently boosting output.';
  $('#ovHint').textContent='PRESS ENTER TO EXECUTE';
  $('#overlay').classList.remove('hide');
  started=false;
}
function startGame(){
  $('#overlay').classList.add('hide'); started=true;
  log('*** NEXUS-7 MAINFRAME /// OPERATOR SESSION BEGIN ***','hi');
  log('Speed x'+SPEED+(SPEED!==1?' (demo)':''),'cy');
}
function loop(ts){
  requestAnimationFrame(loop);
  if(over) return;
  if(!loop.last) loop.last=ts;
  let dt=(ts-loop.last)/1000; loop.last=ts;
  dt=Math.min(dt,0.25);
  scope(ts);
  if(started){ tick(dt); render(); }
}

/* ---------- input ---------- */
addEventListener('keydown',e=>{
  if(e.key==='Enter' && !started){ startGame(); return; }
  if(!started) return;
  if(e.code==='Space'){ e.preventDefault(); exec({clientX:innerWidth*0.2,clientY:innerHeight*0.25}); render(); }
});
$('#exec').onclick=e=>{ if(started){ exec(e); render(); } };
$('#scrub').onclick=()=>{ if(started){ scrub(); render(); } };
$('#reboot').onclick=()=>{ if(started){ reboot(false); } };

/* ---------- go ---------- */
const had=load();
$('#savestate').textContent=had?'SAVE RESTORED':'NO SAVE';
bootOverlay();
requestAnimationFrame(loop);
setInterval(()=>{ save(); $('#savestate').textContent='SAVED '+new Date().toTimeString().slice(0,8); },5000);
setInterval(()=>{ if(started) $('#cursor').style.visibility=($('#cursor').style.visibility==='hidden'?'':'hidden'); },500);

// expose for test/debug
window.NEXUS={S,prod,fmt,buy,buyUpg,scrub,reboot,exec,start:startGame,SPEED};
</script>
